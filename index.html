<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Enigma Sudoku</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="fav.svg">
  
  <style>
    /* --- PERFECT RESET --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
    
    /* --- MAIN CONTAINER --- */
    #main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: 20px;
      gap: 8px;
    }
    
    /* --- TITLE (CENTER TOP) --- */
    .title-bar {
      text-align: center;
      flex-shrink: 0;
      padding: 2px 0;
      width: 100%;
    }
    .title-bar .title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 8px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
    }
    .title-bar .title .accent {
      color: #c9a84c;
      font-weight: 400;
    }
    
    /* --- CANVAS CONTAINER --- */
    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      padding: 0 10px;
      position: relative;
    }
    
    canvas {
      display: block;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      image-rendering: auto;
      touch-action: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      transition: opacity 0.6s ease, transform 0.6s ease;
      background: #0a0a0a;
      cursor: pointer;
    }
    
    /* --- SHIRT MOCKUP --- */
    #shirt-mockup {
      display: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #shirt-mockup.active {
      display: block;
      animation: fadeIn 0.6s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    canvas.hidden {
      display: none;
    }
    
    /* --- BOTTOM BAR --- */
    .bottom-bar {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 6px;
      padding: 4px 0;
    }
    
    /* --- CONTROLS --- */
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    
    .controls {
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.04);
      padding: 8px 20px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      touch-action: manipulation;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .controls:hover {
      color: rgba(255,255,255,0.95);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
    }
    .controls:active {
      transform: scale(0.95);
    }
    .controls .key {
      color: rgba(255,255,255,0.5);
      font-weight: 300;
    }
    .controls .sep {
      color: rgba(255,255,255,0.15);
      margin: 0 4px;
    }
    
    /* --- SHIRT BUTTON --- */
    .controls.shirt-btn {
      border-color: rgba(201, 168, 76, 0.2);
      color: rgba(201, 168, 76, 0.7);
      letter-spacing: 1px;
    }
    .controls.shirt-btn:hover {
      border-color: rgba(201, 168, 76, 0.4);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.06);
    }
    .controls.shirt-btn.active {
      border-color: rgba(201, 168, 76, 0.5);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
    }
    .controls.shirt-btn .icon {
      font-size: 14px;
      line-height: 1;
    }
    
    /* --- INFO ROW --- */
    .info-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      color: rgba(255,255,255,0.3);
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
      flex-wrap: wrap;
      padding: 2px 0;
    }
    .info-row .info-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.02);
    }
    .info-row .label {
      color: rgba(255,255,255,0.25);
      font-weight: 300;
    }
    .info-row .value {
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }
    
    /* --- DESCRIPTION --- */
    .description {
      display: block;
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 8px;
      letter-spacing: 1.2px;
      line-height: 1.8;
      padding: 2px 10px;
      font-weight: 300;
      max-width: 500px;
      width: 100%;
      text-transform: uppercase;
    }
    .description .highlight {
      color: rgba(255,255,255,0.4);
    }
    .description .sep {
      color: rgba(255,255,255,0.08);
      margin: 0 4px;
    }
    
    /* ============================================
       RESPONSIVE
    ============================================ */
    
    @media (max-width: 1024px) {
      #main-container { padding: 16px; gap: 6px; }
      .title-bar .title { font-size: 20px; letter-spacing: 6px; }
      .controls { font-size: 10px; padding: 7px 16px; min-height: 34px; }
      .info-row { font-size: 8.5px; gap: 12px; }
      .info-row .info-item { padding: 2px 10px; }
      .description { font-size: 7.5px; letter-spacing: 1px; }
    }
    
    @media (max-width: 768px) {
      #main-container { padding: 12px; gap: 5px; }
      .title-bar .title { font-size: 17px; letter-spacing: 5px; }
      #canvas-container { padding: 0 6px; }
      .controls { font-size: 9px; padding: 6px 14px; min-height: 32px; letter-spacing: 0.6px; }
      .controls-row { gap: 6px; }
      .info-row { font-size: 8px; gap: 10px; }
      .info-row .info-item { padding: 2px 8px; }
      .description { font-size: 7px; letter-spacing: 0.8px; padding: 2px 6px; }
      .controls.shirt-btn .icon { font-size: 12px; }
    }
    
    @media (max-width: 480px) {
      #main-container { padding: 8px; gap: 4px; }
      .title-bar .title { font-size: 14px; letter-spacing: 4px; }
      #canvas-container { padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; border-radius: 24px; letter-spacing: 0.4px; }
      .controls-row { gap: 4px; }
      .info-row { font-size: 7px; gap: 8px; }
      .info-row .info-item { padding: 2px 6px; gap: 4px; }
      .description { font-size: 6.5px; letter-spacing: 0.6px; padding: 2px 4px; line-height: 1.6; }
      .controls.shirt-btn .icon { font-size: 11px; }
    }
    
    @media (max-width: 380px) {
      #main-container { padding: 6px; gap: 3px; }
      .title-bar .title { font-size: 12px; letter-spacing: 3px; }
      #canvas-container { padding: 0 2px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 26px; border-radius: 20px; }
      .info-row { font-size: 6.5px; gap: 6px; }
      .info-row .info-item { padding: 1px 5px; border-radius: 14px; }
      .description { font-size: 6px; letter-spacing: 0.5px; padding: 1px 3px; }
      .controls.shirt-btn .icon { font-size: 10px; }
    }
    
    @media (orientation: landscape) and (max-height: 500px) {
      #main-container { padding: 10px 20px; gap: 4px; flex-direction: row; flex-wrap: wrap; }
      .title-bar { width: 100%; flex-shrink: 0; }
      .title-bar .title { font-size: 16px; letter-spacing: 4px; }
      #canvas-container { flex: 1; min-height: 0; height: 100%; padding: 0 8px; }
      .bottom-bar { width: auto; max-width: 180px; flex-shrink: 0; gap: 4px; padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; letter-spacing: 0.4px; }
      .controls-row { flex-direction: column; gap: 4px; }
      .info-row { font-size: 7px; gap: 6px; flex-direction: column; align-items: stretch; }
      .info-row .info-item { padding: 2px 8px; justify-content: center; }
      .description { font-size: 6px; max-width: 160px; padding: 1px 4px; line-height: 1.4; letter-spacing: 0.5px; }
    }
    
    @media (orientation: landscape) and (max-height: 380px) {
      #main-container { padding: 6px 12px; gap: 3px; }
      .title-bar .title { font-size: 13px; letter-spacing: 3px; }
      #canvas-container { padding: 0 4px; }
      .bottom-bar { max-width: 140px; gap: 3px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 24px; border-radius: 16px; }
      .info-row { font-size: 6px; gap: 4px; }
      .info-row .info-item { padding: 1px 6px; }
      .description { font-size: 5.5px; max-width: 120px; padding: 1px 3px; }
    }
    
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
      canvas { image-rendering: auto; }
    }
    
    @supports (-webkit-touch-callout: none) {
      .controls { min-height: 40px; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .controls, canvas, #shirt-mockup { transition: none; }
      #shirt-mockup.active { animation: none; }
    }
  </style>

<body>

<!-- MAIN CONTAINER -->
<div id="main-container">

  <!-- TITLE (CENTER TOP) -->
  <div class="title-bar">
    <div class="title"><span class="accent">Enigma Sudoku</span></div>
  </div>

  <!-- CANVAS CONTAINER -->
  <div id="canvas-container">
    <canvas id="target"></canvas>
    <img id="shirt-mockup" src="Enigma-Sudoku.jpg" alt="Enigma-Sudoku on T-Shirt" />
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">

    <!-- CONTROLS ROW -->
    <div class="controls-row">
      <div class="controls" id="controlsBar">
        <span class="key">●</span> new game <span class="sep">—</span> <span class="key">S</span> save
      </div>
      <div class="controls shirt-btn" id="shirtToggle">
        <span class="icon">◷</span> apparel
      </div>
    </div>

    <!-- INFO ROW -->
    <div class="info-row">
      <div class="info-item">
        <span class="label">seed</span>
        <span class="value" id="seedDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">filled</span>
        <span class="value" id="filledDisplay">---</span>
      </div>
    </div>

    <!-- DESCRIPTION -->
    <div class="description">
      <span class="highlight">sudoku</span>
      <span class="sep">·</span>
      <span class="highlight">interactive</span>
      <span class="sep">·</span>
      <span class="highlight">click to play</span>
      <span class="sep">·</span>
      <span class="highlight">seed-based</span>
    </div>

  </div>

</div>

<script>
// ============================================
// SUDOKU — PURE JS INTERACTIVE T-SHIRT EDITION
// ============================================

// --- DETERMINISTIC RANDOM GENERATOR ---
class RandomGenerator {
  constructor(seed) {
    this.seed = seed;
    this.state = seed;
  }
  rand() {
    let x = this.state;
    x ^= x << 13;
    x ^= x >> 17;
    x ^= x << 5;
    this.state = x;
    return (x >>> 0) / 4294967296;
  }
}

// --- STATE ---
const ratio = 1 / 1;
const prefix = 'Sudoku';
let seed = Date.now() + Math.random() * 1000000;
let rng = new RandomGenerator(seed);
let showingShirt = false;
let resizeTmr = null;
let sudokuGame = null;
let canvasSize = 600;

// --- URL PARAMS ---
const urlSearchParams = new URLSearchParams(window.location.search);
const urlParams = Object.fromEntries(urlSearchParams.entries());
let forceDownloaded = false;

// --- Canvas roundRect polyfill ---
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, radii) {
    const r = typeof radii === 'number' ? radii : (radii || 0);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    return this;
  };
}

// --- SUDOKU CLASS ---
class Sudoku {
  constructor(canvasSize, gridSize) {
    this.canvasSize = canvasSize;
    this.gridSize = gridSize;
    this.cellSize = 0;
    this.gridWidth = 0;
    this.gridX = 0;
    this.gridY = 0;
    this.boxSize = 0;
    this.selectedNumber = 1;
    this.grid = [];
    this.lockedCells = [];
    this.numberValidity = [];
    this.correctGrid = [];
    this.selectedRow = -1;
    this.selectedCol = -1;
    this.initialize();
  }

  initialize() {
    const goldenRatio = 1.618;
    this.gridWidth = this.canvasSize / goldenRatio;
    this.cellSize = this.gridWidth / this.gridSize;
    this.boxSize = (this.canvasSize - this.gridWidth) / 2;

    this.gridX = (this.canvasSize - this.gridWidth) / 2;
    this.gridY = (this.canvasSize - this.gridWidth - this.boxSize) / 2;

    this.lockedCells = Array(this.gridSize).fill().map(() => Array(this.gridSize).fill(false));
    this.numberValidity = Array(this.gridSize).fill().map(() => Array(this.gridSize).fill(true));

    this.grid = this.generateSudoku();
    this.correctGrid = JSON.parse(JSON.stringify(this.grid));
    this.removeNumbers(40);
    this.selectedRow = -1;
    this.selectedCol = -1;
    this.selectedNumber = 1;
  }

  generateSudoku() {
    let grid = Array.from({ length: this.gridSize }, () => Array(this.gridSize).fill(0));
    this.fillGrid(grid);
    return grid;
  }

  fillGrid(grid) {
    let numbers = Array.from({ length: this.gridSize }, (_, i) => i + 1);
    for (let i = 0; i < this.gridSize; i++) {
      for (let j = 0; j < this.gridSize; j++) {
        if (grid[i][j] == 0) {
          numbers = this.shuffle(numbers);
          for (let num of numbers) {
            if (this.isSafe(grid, i, j, num)) {
              grid[i][j] = num;
              if (this.fillGrid(grid)) return true;
              grid[i][j] = 0;
            }
          }
          return false;
        }
      }
    }
    return true;
  }

  shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(rng.rand() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  isSafe(grid, row, col, num) {
    for (let x = 0; x < this.gridSize; x++) {
      if (grid[row][x] === num || grid[x][col] === num) return false;
    }
    let startRow = Math.floor(row / 3) * 3;
    let startCol = Math.floor(col / 3) * 3;
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        if (grid[i + startRow][j + startCol] === num) return false;
      }
    }
    return true;
  }

  removeNumbers(count) {
    for (let i = 0; i < count; i++) {
      let row = Math.floor(rng.rand() * this.gridSize);
      let col = Math.floor(rng.rand() * this.gridSize);
      if (this.grid[row][col] !== 0) {
        this.grid[row][col] = 0;
        this.numberValidity[row][col] = true;
      }
    }
    for (let i = 0; i < this.gridSize; i++) {
      for (let j = 0; j < this.gridSize; j++) {
        if (this.grid[i][j] !== 0) {
          this.lockedCells[i][j] = true;
        }
      }
    }
  }

  checkNumberValidity(row, col, num) {
    return this.correctGrid[row][col] === num;
  }

  draw(ctx, w, h) {
    // Update canvas size without reinitializing
    this.canvasSize = Math.min(w, h);
    const goldenRatio = 1.618;
    this.gridWidth = this.canvasSize / goldenRatio;
    this.cellSize = this.gridWidth / this.gridSize;
    this.boxSize = (this.canvasSize - this.gridWidth) / 2;
    this.gridX = (this.canvasSize - this.gridWidth) / 2;
    this.gridY = (this.canvasSize - this.gridWidth - this.boxSize) / 2;

    // Draw background
    ctx.fillStyle = '#141852';
    ctx.fillRect(0, 0, w, h);

    // Draw grid cells
    ctx.strokeStyle = '#6464C8';
    ctx.lineWidth = 2;
    for (let i = 0; i < this.gridSize; i++) {
      for (let j = 0; j < this.gridSize; j++) {
        let x = this.gridX + j * this.cellSize;
        let y = this.gridY + i * this.cellSize;
        ctx.fillStyle = '#282878';
        ctx.fillRect(x, y, this.cellSize, this.cellSize);
      }
    }

    // Draw bold grid lines (3x3 boxes)
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 4;
    for (let i = 0; i <= this.gridSize; i += 3) {
      ctx.beginPath();
      ctx.moveTo(this.gridX + i * this.cellSize, this.gridY);
      ctx.lineTo(this.gridX + i * this.cellSize, this.gridY + this.gridWidth);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(this.gridX, this.gridY + i * this.cellSize);
      ctx.lineTo(this.gridX + this.gridWidth, this.gridY + i * this.cellSize);
      ctx.stroke();
    }

    // Highlight selected row/col
    if (this.selectedRow !== -1 && this.selectedCol !== -1) {
      ctx.fillStyle = 'rgba(60, 180, 200, 0.4)';
      ctx.fillRect(this.gridX, this.gridY + this.selectedRow * this.cellSize, this.gridWidth, this.cellSize);
      ctx.fillRect(this.gridX + this.selectedCol * this.cellSize, this.gridY, this.cellSize, this.gridWidth);
    }

    // Highlight same numbers
    if (this.selectedNumber !== -1) {
      ctx.fillStyle = 'rgba(255, 255, 100, 0.4)';
      for (let i = 0; i < this.gridSize; i++) {
        for (let j = 0; j < this.gridSize; j++) {
          if (this.grid[i][j] === this.selectedNumber) {
            ctx.fillRect(this.gridX + j * this.cellSize, this.gridY + i * this.cellSize, this.cellSize, this.cellSize);
          }
        }
      }
    }

    // Draw numbers
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + (this.cellSize * 0.8) + 'px Arial';

    for (let i = 0; i < this.gridSize; i++) {
      for (let j = 0; j < this.gridSize; j++) {
        let x = this.gridX + j * this.cellSize + this.cellSize / 2;
        let y = this.gridY + i * this.cellSize + this.cellSize / 2;
        let number = this.grid[i][j];
        if (number != 0) {
          if (!this.numberValidity[i][j]) {
            ctx.fillStyle = '#FF3C3C';
          } else if (this.lockedCells[i][j]) {
            ctx.fillStyle = '#FFFFFF';
          } else {
            ctx.fillStyle = '#F0F0FF';
          }
          ctx.fillText(number, x, y);
        }
      }
    }

    // Draw number selection boxes (bottom)
    let boxWidth = this.boxSize / this.gridSize;
    let padding = boxWidth * 0.2;
    let totalBoxWidth = boxWidth * this.gridSize + padding * (this.gridSize - 1);
    let boxX = (this.canvasSize - totalBoxWidth) / 2;
    let boxY = this.canvasSize - this.boxSize + padding;

    for (let i = 0; i < this.gridSize; i++) {
      let x = boxX + i * (boxWidth + padding);
      let y = boxY;
      let isSelected = this.selectedNumber === i + 1;

      ctx.shadowBlur = 0;
      ctx.fillStyle = isSelected ? '#FFA500' : '#4682B4';
      ctx.beginPath();
      ctx.roundRect(x, y, boxWidth, boxWidth, 10);
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold ' + (boxWidth * 0.7) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(i + 1, x + boxWidth / 2, y + boxWidth / 2);
    }
  }

  mousePressed(mx, my) {
    // Check number box clicks
    let boxWidth = this.boxSize / this.gridSize;
    let padding = boxWidth * 0.2;
    let totalBoxWidth = boxWidth * this.gridSize + padding * (this.gridSize - 1);
    let boxX = (this.canvasSize - totalBoxWidth) / 2;
    let boxY = this.canvasSize - this.boxSize + padding;

    if (my > boxY && my < boxY + boxWidth) {
      for (let i = 0; i < this.gridSize; i++) {
        let x = boxX + i * (boxWidth + padding);
        if (mx > x && mx < x + boxWidth) {
          this.selectedNumber = i + 1;
          return true;
        }
      }
      return false;
    }

    // Check grid click
    let col = Math.floor((mx - this.gridX) / this.cellSize);
    let row = Math.floor((my - this.gridY) / this.cellSize);

    if (col >= 0 && col < this.gridSize && row >= 0 && row < this.gridSize) {
      this.selectedRow = row;
      this.selectedCol = col;

      if (!this.lockedCells[row][col]) {
        if (!this.numberValidity[row][col]) {
          this.grid[row][col] = 0;
          this.numberValidity[row][col] = true;
        } else if (this.checkNumberValidity(row, col, this.selectedNumber)) {
          this.grid[row][col] = this.selectedNumber;
          this.numberValidity[row][col] = true;
          this.lockedCells[row][col] = true;
        } else {
          this.grid[row][col] = this.selectedNumber;
          this.numberValidity[row][col] = false;
        }
        return true;
      } else if (!this.numberValidity[row][col]) {
        this.grid[row][col] = 0;
        this.numberValidity[row][col] = true;
        return true;
      }
    }
    return false;
  }

  getFilledCount() {
    let count = 0;
    for (let i = 0; i < this.gridSize; i++) {
      for (let j = 0; j < this.gridSize; j++) {
        if (this.grid[i][j] !== 0) count++;
      }
    }
    return count;
  }

  isComplete() {
    return this.getFilledCount() === this.gridSize * this.gridSize;
  }
}

// --- MAIN DRAW ---
function drawCanvas() {
  const canvas = document.getElementById('target');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  if (!sudokuGame) {
    sudokuGame = new Sudoku(Math.min(w, h), 9);
  }

  sudokuGame.draw(ctx, w, h);

  updateUI();

  if ('forceDownload' in urlParams && forceDownloaded === false) {
    forceDownloaded = true;
    autoDownloadCanvas();
    if (window.parent) {
      window.parent.postMessage('forceDownloaded', '*');
    }
  }
}

// --- UPDATE UI ---
function updateUI() {
  document.getElementById('seedDisplay').textContent = String(seed).slice(0, 8);
  if (sudokuGame) {
    document.getElementById('filledDisplay').textContent = sudokuGame.getFilledCount() + '/81';
  }
}

// --- REGENERATE (New Game) ---
function regenerate() {
  seed = Date.now() + Math.random() * 1000000;
  rng = new RandomGenerator(seed);
  sudokuGame = null;
  
  if (showingShirt) {
    toggleShirt();
  }
  
  layoutCanvas();
}

// --- TOGGLE SHIRT ---
function toggleShirt() {
  showingShirt = !showingShirt;
  const canvas = document.getElementById('target');
  const shirtMockup = document.getElementById('shirt-mockup');
  const shirtToggle = document.getElementById('shirtToggle');
  
  if (showingShirt) {
    canvas.classList.add('hidden');
    shirtMockup.classList.add('active');
    shirtToggle.classList.add('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> artwork';
  } else {
    canvas.classList.remove('hidden');
    shirtMockup.classList.remove('active');
    shirtToggle.classList.remove('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
  }
}

// --- DOWNLOAD ---
function autoDownloadCanvas() {
  const canvas = document.getElementById('target');
  const link = document.createElement('a');
  
  const seedStr = String(seed).slice(0, 8);
  link.download = prefix + '_Seed' + seedStr + '.png';
  
  if (showingShirt) {
    link.href = document.getElementById('shirt-mockup').src;
  } else {
    link.href = canvas.toDataURL('image/png', 1.0);
  }
  link.click();
}

// --- LAYOUT CANVAS ---
function layoutCanvas() {
  const container = document.getElementById('canvas-container');
  const containerRect = container.getBoundingClientRect();
  let maxWidth = containerRect.width;
  let maxHeight = containerRect.height;
  
  maxWidth = Math.max(maxWidth, 80);
  maxHeight = Math.max(maxHeight, 80);
  
  let cWidth = maxWidth;
  let cHeight = cWidth / ratio;
  
  if (cHeight > maxHeight) {
    cHeight = maxHeight;
    cWidth = maxHeight * ratio;
  }
  
  cWidth = Math.max(cWidth, 80);
  cHeight = Math.max(cHeight, 80);
  
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  
  let targetWidth = cWidth * dpr;
  let targetHeight = cHeight * dpr;
  
  if ('forceWidth' in urlParams) {
    targetWidth = parseInt(urlParams.forceWidth);
    targetHeight = Math.floor(targetWidth / ratio);
    dpr = 1;
  }
  
  const canvas = document.getElementById('target');
  canvas.width = targetWidth;
  canvas.height = targetHeight;
  canvas.style.width = cWidth + 'px';
  canvas.style.height = cHeight + 'px';
  
  const shirtMockup = document.getElementById('shirt-mockup');
  shirtMockup.style.width = cWidth + 'px';
  shirtMockup.style.height = cHeight + 'px';
  
  drawCanvas();
}

// --- MOUSE/Touch Handler ---
function handleCanvasClick(e) {
  if (showingShirt || !sudokuGame) return;
  
  const canvas = document.getElementById('target');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  
  let clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
    e.preventDefault();
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  
  const mx = (clientX - rect.left) * scaleX;
  const my = (clientY - rect.top) * scaleY;
  
  if (sudokuGame.mousePressed(mx, my)) {
    drawCanvas();
    // Check if puzzle is complete
    if (sudokuGame.isComplete()) {
      // You can add a celebration effect here
      console.log('🎉 Puzzle Complete!');
    }
  }
}

// --- KEYBOARD ---
document.addEventListener('keydown', function(e) {
  if (e.key === 's' || e.key === 'S') {
    e.preventDefault();
    autoDownloadCanvas();
  }
  if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    regenerate();
  }
  if (e.key === 't' || e.key === 'T') {
    e.preventDefault();
    toggleShirt();
  }
  // Number keys for quick selection
  if (e.key >= '1' && e.key <= '9' && sudokuGame) {
    sudokuGame.selectedNumber = parseInt(e.key);
    drawCanvas();
  }
});

// --- CONTROLS ---
document.getElementById('controlsBar').addEventListener('click', regenerate);
document.getElementById('controlsBar').addEventListener('touchend', function(e) {
  e.preventDefault();
  regenerate();
});

document.getElementById('shirtToggle').addEventListener('click', toggleShirt);
document.getElementById('shirtToggle').addEventListener('touchend', function(e) {
  e.preventDefault();
  toggleShirt();
});

// --- CANVAS EVENTS ---
const canvasContainer = document.getElementById('canvas-container');
canvasContainer.addEventListener('click', handleCanvasClick);
canvasContainer.addEventListener('touchstart', handleCanvasClick, { passive: false });

// --- RESIZE ---
function handleResize() {
  clearTimeout(resizeTmr);
  resizeTmr = setTimeout(() => {
    layoutCanvas();
  }, 100);
}

window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', function() {
  setTimeout(handleResize, 400);
});

// --- VISIBILITY ---
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    setTimeout(() => {
      if (!showingShirt) {
        drawCanvas();
      }
    }, 100);
  }
});

// --- INIT ---
function init() {
  layoutCanvas();
  updateUI();
  
  console.log('Sudoku — Interactive T-Shirt Edition');
  console.log('◷ Press T to toggle apparel view');
  console.log('Press S to save');
  console.log('Press R for new game');
  console.log('Press 1-9 to select number');
  console.log('Click grid to place number');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// Expose functions globally
window.regenerate = regenerate;
window.autoDownloadCanvas = autoDownloadCanvas;
window.toggleShirt = toggleShirt;
window.drawCanvas = drawCanvas;
window.layoutCanvas = layoutCanvas;
</script>
</body>
